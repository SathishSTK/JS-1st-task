 <!-- Task 6 — Product Details Card -->
  
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Product Details</title>

    <style>
        body{
            font-family: arial;
            background-color: white;
        }

        h1{
            text-align: center;
        }

        #products{
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card{
            width: 280px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;

        }

        .card > img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

    </style>
</head>
<body>
    <h1>Product Details</h1>

    <div id="products"></div>
    
    <script src="./task6.js"></script>
</body>
</html>
