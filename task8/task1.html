 <!-- Task 1 — Product Cards -->
   
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Product Cards</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        #products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .newcard {
            width: 220px;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .newcard img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .newcard h3 {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Product Cards</h1>

    <div id="products"></div>

    <script src="./task1.js"></script>

</body>

</html>
