<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus Product Card</title>

     <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            width: 280px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>


    <h1>Products Cards</h1>

    <div class="products"></div>

    <script src="./BonusTask.js"></script>

</body>
</html>
